        { titulo: 'Como a gente mede', texto: 'Cada frente começa com um indicador definido. Você acompanha o que está trazendo cliente, e não só o que foi postado.' },
      ],
      cta: 'Falar sobre a agência no WhatsApp',
      whatsapp: 'agencia',
      mensagem: 'Oi! Vim pelo link da bio do @{insta} e quero falar sobre a agência Forno Lab.',
    },
    {
      id: 'advisor',
      nome: 'Advisor',
      tag: 'Implementação · 6 meses',
      cor: '#1F7A4D',                  // TODO cor provisória: a marca Advisor ainda não definiu
      instagram: 'advisor.cc',
      eyebrow: 'Implementação de marketing',
      titulo: 'Começo, meio e fim.',
      intro: 'Pra empresa que já tem marketing interno ou agência, ou que vai precisar contratar um dos dois. A gente direciona e implementa. Quem executa é o seu time.',
      blocos: [
        { titulo: 'Como funciona', sequencia: true, lista: ['Diagnóstico do marketing e do comercial de hoje', 'Planejamento e posicionamento', 'Rotina de comunicação ligada às campanhas e ao comercial', 'Indicadores pra acompanhar o que dá resultado'] },
        { titulo: 'Formato', texto: 'Contrato de 6 meses, com data pra terminar. Dá pra entrar por duas portas: diagnóstico avulso ou CMO em contrato.' },

      eyebrow: 'Founder-Led Growth',
      titulo: 'Quem aparece, vende.',
      intro: 'Pra empresário, founder e autônomo que quer transformar a própria presença no digital em venda, com o próprio rosto à frente do negócio.',
      blocos: [

  ],

  cardsWhatsapp: [
    { titulo: 'Quero falar sobre a agência (Forno Lab)', numero: 'agencia',
      mensagem: 'Oi! Vim pelo link da bio do @{insta} e quero falar sobre a agência Forno Lab.' },
    { titulo: 'Quero falar sobre Advisor / Founders', numero: 'advisorFounders',
      mensagem: 'Oi! Vim pelo link da bio do @{insta} e quero falar sobre o Advisor / Founders.' },

};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* ======================================================================
   MODELO — idêntico em todas as páginas. Não editar por pessoa: use o CONFIG.
   Layout: coluna única mobile-first (390px, máx. 480px);
   no desktop a página aparece dentro de uma moldura de celular.
   ====================================================================== */
:root{
  --ink:#0C0C0D;
  --muted:#545552;
  --screen-top:#F6F5F2;
  --screen-bot:#E1E2DE;
  --stage:#CFCFCA;
  --glass:rgba(255,255,255,.6);
  --glass-line:rgba(255,255,255,.8);
  --forno:#FF5200;
  /* cores dos produtos: o JS sobrescreve com CONFIG.produtos[].cor */
  --c-forno:#FF5200;
  --c-advisor:#1F7A4D; /* provisória, a marca Advisor ainda não definiu a cor */
  --c-founders:#2334BD;
  --paper:#F3F1EA;
  --wa-ink:#0F3B22;
  --sheet-bg:#FBFBF9;
  --font:"Helvetica Now Display", Inter, "Helvetica Neue", Arial, sans-serif;
  --serif:"EB Garamond", Georgia, "Times New Roman", serif;
  --r-xl:30px; --r-lg:24px; --r-md:20px;
  --shadow:0 1px 2px rgba(12,12,13,.06), 0 12px 30px rgba(12,12,13,.09);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--screen-bot)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--forno);outline-offset:3px;border-radius:12px}
.show-todo .todo{display:inline-flex}
.todo{display:none;align-items:center;gap:4px;font:700 9px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;
  padding:5px 7px;border-radius:999px;border:1px dashed currentColor;background:rgba(255,255,255,.85);color:#6A4A00;white-space:nowrap}

/* ---------- palco / moldura ---------- */
.stage{min-height:100vh}
.caption{display:none}
.device{position:relative;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:clip;
  background:
    radial-gradient(90% 38% at 50% -6%, rgba(255,82,0,.13), rgba(255,82,0,0) 70%),
    linear-gradient(180deg,var(--screen-top) 0%,var(--screen-bot) 100%)}
.screen{padding:32px 16px 36px;display:flex;flex-direction:column;gap:26px}

@media (min-width:760px){
  html,body{background:radial-gradient(120% 90% at 30% 10%,#EDEDEA 0%,var(--stage) 70%)}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 16px}
  .caption{display:flex;align-items:center;gap:10px;margin:0;font-size:13px;font-weight:600;color:var(--muted)}
  .caption b{background:var(--ink);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
  .device{width:390px;max-width:100%;height:min(844px,calc(100vh - 110px));min-height:560px;margin:0;border-radius:58px;
    border:12px solid #121213;box-shadow:0 0 0 1px #2a2a2c,0 40px 80px rgba(12,12,13,.28),0 12px 24px rgba(12,12,13,.16);overflow:hidden}
  .device::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#121213;z-index:5}
  .screen{height:100%;overflow-y:auto;padding-top:56px;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .device.locked .screen{overflow:hidden}
}

/* ---------- topo ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.avatar{position:relative;width:116px;height:116px;border-radius:50%;margin-bottom:6px;
  background:linear-gradient(145deg,#2A2A2C,#0C0C0D);display:grid;place-items:center;
  box-shadow:0 0 0 4px #fff,0 0 0 5px rgba(255,82,0,.35),0 14px 30px rgba(12,12,13,.18)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar .ini{font-weight:900;font-size:38px;letter-spacing:-.04em;color:#fff}
.avatar .todo{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%)}
.name{margin:8px 0 0;font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.role{margin:0;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.02em}
.role svg{width:13px;height:13px;color:var(--forno)}
.sub{margin:4px 0 0;max-width:31ch;font-size:15.5px;font-weight:500;color:#3C3D3A;line-height:1.45;text-wrap:balance}
.socials{display:flex;gap:12px;margin-top:10px}
.soc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;text-decoration:none;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 6px 16px rgba(12,12,13,.07);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .2s}
.soc:hover{transform:translateY(-2px)}
.soc svg{width:23px;height:23px}

/* ---------- botão principal ---------- */
.cta{position:relative;display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:34px;
  background:var(--ink);color:#fff;text-decoration:none;isolation:isolate}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  box-shadow:0 0 0 1px rgba(255,82,0,.4),0 14px 32px rgba(255,82,0,.18);animation:glow 3.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(255,82,0,.7),0 14px 40px rgba(255,82,0,.32)}}
.cta-ic{flex:none;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.cta-ic svg{width:24px;height:24px;color:var(--forno)}
.cta-txt{min-width:0;flex:1;display:grid;gap:3px}
.cta-t{font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.cta-s{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.76);line-height:1.35}
.cta-go{flex:none;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;transition:transform .25s}
.cta-go svg{width:18px;height:18px}
.cta:hover .cta-go{transform:translateX(3px);background:var(--forno);color:var(--ink)}

/* ---------- carrossel de produtos ---------- */
.sec-title{margin:0 0 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
.sec-title svg{width:11px;height:11px;color:#A3A49F}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 6px;scroll-padding-inline:16px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.prod{flex:0 0 64%;max-width:270px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s}
.cover:hover{transform:translateY(-3px)}
.prod-n .todo{margin-left:6px;vertical-align:2px}
.prod-n{margin:6px 0 0;font-size:14.5px;font-weight:900;letter-spacing:.01em;text-transform:uppercase}
.prod-t{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.more{align-self:flex-start;margin-top:6px;border:0;cursor:pointer;background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:11px 16px;border-radius:999px;transition:background .2s}
.more:hover{background:#2a2a2c}

.cv{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column}
/* capa Forno Lab */
.cv-forno{justify-content:space-between;color:#fff;
  background:radial-gradient(140% 58% at 50% 118%,rgba(255,82,0,.7),rgba(255,82,0,0) 64%),#0C0C0D}
.cv-top{display:flex;justify-content:space-between;align-items:center}
.cv-flame{width:30px;height:30px;color:var(--c-forno)}
.cv-kicker{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.cv-word{display:flex;flex-direction:column;font-weight:900;font-size:54px;line-height:.84;letter-spacing:-.05em}
.cv-word span+span{color:var(--c-forno)}
.cv-ember{display:block;height:2px;margin:12px 0 10px;background:linear-gradient(90deg,var(--c-forno),rgba(255,82,0,0))}
.cv-slogan{margin:0;font-size:13px;font-weight:700;line-height:1.25;max-width:17ch}
/* capa Advisor */
.cv-advisor{justify-content:space-between;color:#fff;
  background:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 0/100% 22px,
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 0 0/22px 100%,
    var(--c-advisor)}
.cv-pill{align-self:flex-start;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:#fff;color:var(--c-advisor);padding:6px 10px;border-radius:999px}
.cv-steps{list-style:none;margin:0 0 0 6px;padding:2px 0 2px 16px;border-left:2px solid rgba(255,255,255,.45);display:grid;gap:11px;font-size:13px;font-weight:700}
.cv-steps li{position:relative}
.cv-steps li::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--c-advisor);border:2px solid #fff}
.cv-steps li:last-child::before{background:#fff}
.cv-aword{font-size:42px;font-weight:900;letter-spacing:-.045em;line-height:.9}
.cv-asub{margin:6px 0 0;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85)}
/* capa Founders (jornal da comunidade) */
.cv-founders{gap:10px;background:var(--paper);color:var(--c-founders)}
.cv-mast{border-top:3px double currentColor;border-bottom:1px solid currentColor;padding:8px 0 6px;text-align:center}
.cv-mast b{display:block;font-family:var(--serif);font-weight:600;font-size:36px;line-height:.95;letter-spacing:-.01em}
.cv-meta{display:flex;justify-content:space-between;margin-top:7px;padding-top:5px;border-top:1px solid rgba(35,52,189,.35);font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.cv-head{margin:2px 0 0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:24px;line-height:1.02}
.cv-body{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr;gap:10px}
.cv-dots{align-self:start;aspect-ratio:1;border-radius:50%;
  background-image:radial-gradient(circle,var(--c-founders) 1.15px,transparent 1.55px);background-size:5px 5px;
  -webkit-mask-image:radial-gradient(circle at 30% 28%,transparent 12%,#000 78%);mask-image:radial-gradient(circle at 30% 28%,transparent 12%,#000 78%)}
.cv-lines{background:repeating-linear-gradient(180deg,rgba(35,52,189,.32) 0 2px,transparent 2px 7px);
  -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}

/* ---------- cards de link (pretos) ---------- */
.stack{display:flex;flex-direction:column;gap:12px}
.lk{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-lg);background:var(--ink);color:#fff;text-decoration:none;box-shadow:var(--shadow);transition:transform .2s}
.lk:hover{transform:translateY(-2px)}
.lk-th{flex:none;width:66px;height:66px;border-radius:17px;display:grid;place-items:center;align-content:center;gap:2px}
.lk-th.live{background:var(--forno);color:var(--ink)}
.lk-th.live small{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:900;letter-spacing:.1em}
.lk-th.live small i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.lk-th.live b{font-size:22px;font-weight:900;letter-spacing:-.04em;line-height:1}
.lk-th.grupo{background:#fff;color:#1F7A4D}
.lk-th.grupo svg{width:30px;height:30px}
.lk-tx{flex:1;min-width:0;display:grid;gap:3px}
.lk-t{font-size:15.5px;font-weight:800;line-height:1.2}
.lk-s{font-size:13px;font-weight:500;color:rgba(255,255,255,.72);line-height:1.35}
.lk-ex{flex:none;width:20px;height:20px;align-self:flex-start;margin-top:4px;color:rgba(255,255,255,.85)}

/* ---------- cards de WhatsApp ---------- */
.wa{position:relative;overflow:hidden;display:grid;gap:14px;padding:18px;border-radius:var(--r-xl);color:var(--wa-ink);
  background:linear-gradient(160deg,rgba(136,206,158,.5),rgba(96,176,124,.36));border:1px solid rgba(255,255,255,.65);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 26px rgba(30,90,50,.1)}
.wa::after{content:"";position:absolute;right:-34px;top:26px;width:128px;height:128px;border-radius:50%;border:18px solid rgba(255,255,255,.26);pointer-events:none}
.wa-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.wa-ic{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center}
.wa-ic svg{width:22px;height:22px}
.wa-l{font-size:15px;font-weight:800;line-height:1.2}
.wa-n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all;opacity:.85}
.wa-t{position:relative;z-index:1;margin:0;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:-.005em;line-height:1.2;text-wrap:balance}
.wa-b{position:relative;z-index:1;display:block;text-align:center;padding:14px;border-radius:999px;background:rgba(255,255,255,.66);
  font-size:14px;font-weight:800;text-decoration:none;transition:background .2s}
.wa-b:hover{background:#fff}

/* ---------- rodapé ---------- */
.foot{display:grid;justify-items:center;gap:6px;padding-top:6px;text-align:center}
.foot a{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.foot a svg{width:16px;height:16px;color:var(--forno)}
.foot p{margin:0;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.foot p svg{width:11px;height:11px;color:var(--forno)}

/* ---------- detalhes do produto (bottom sheet) ---------- */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(12,12,13,.5);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:480px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--sheet-bg);border-radius:28px 28px 0 0;padding:10px 16px 0;
  transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(12,12,13,.2)}
.layer.open .backdrop{opacity:1}
.layer.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(12,12,13,.18);margin:0 auto 10px}
.x{position:absolute;top:28px;right:28px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.94);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(12,12,13,.15)}
.x svg{width:16px;height:16px}
.sh-head{border-radius:22px;padding:22px 20px 20px;display:grid;gap:10px;justify-items:start}
.sh-eye{margin:0;padding-right:46px;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.sh-title{margin:0;font-size:32px;font-weight:900;letter-spacing:-.035em;line-height:1;text-wrap:balance}
.sh-ig{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.sh-ig svg{width:15px;height:15px}
.sh-body{padding:20px 4px 4px;display:grid;gap:20px}
.sh-intro{margin:0;font-size:16px;line-height:1.5;font-weight:500}
.blk h3{margin:0 0 9px;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0;font-size:15px;line-height:1.5}
.blk ul,.blk ol{list-style:none;margin:0;padding:0;display:grid;gap:9px;counter-reset:passo}
.blk li{display:flex;gap:11px;align-items:baseline;font-size:15px;line-height:1.4}
.blk ul li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--acc);transform:translateY(-1px)}
.blk ol li{counter-increment:passo;align-items:center}
.blk ol li::before{content:counter(passo);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:900}
.sh-act{position:sticky;bottom:0;display:grid;gap:2px;padding:24px 0 calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(251,251,249,0),var(--sheet-bg) 26%)}
.sh-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 18px;border-radius:999px;
  background:var(--btn);color:var(--btn-ink);font-size:15px;font-weight:800;text-decoration:none;text-align:center;transition:filter .2s}
.sh-btn:hover{filter:brightness(1.08)}
.sh-btn svg{width:20px;height:20px;flex:none}
.sh-quiz{display:block;text-align:center;padding:13px 8px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.sheet[data-p="forno"]{--acc:var(--c-forno);--acc-ink:var(--ink);--btn:var(--c-forno);--btn-ink:var(--ink)}
.sheet[data-p="forno"] .sh-head{color:#fff;background:radial-gradient(120% 90% at 100% 120%,rgba(255,82,0,.5),rgba(255,82,0,0) 60%),#0C0C0D}
.sheet[data-p="forno"] .sh-eye{color:var(--c-forno)}
.sheet[data-p="advisor"]{--acc:var(--c-advisor);--acc-ink:#fff;--btn:var(--c-advisor);--btn-ink:#fff}
.sheet[data-p="advisor"] .sh-head{color:#fff;background:
  linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/100% 22px,
  linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/22px 100%,var(--c-advisor)}
.sheet[data-p="advisor"] .sh-eye{color:rgba(255,255,255,.85)}
.sheet[data-p="founders"]{--acc:var(--c-founders);--acc-ink:#fff;--btn:var(--c-founders);--btn-ink:#fff}
.sheet[data-p="founders"] .sh-head{color:var(--c-founders);background:var(--paper);border:1px solid rgba(35,52,189,.22)}
.sheet[data-p="founders"] .sh-title{font-family:var(--serif);font-weight:500;font-style:italic;font-size:40px;letter-spacing:-.01em}
.sheet[data-p="founders"] .sh-ig{background:rgba(35,52,189,.08)}

/* ---------- aviso ---------- */
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);padding:11px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;
  transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){.layer,.toast{position:absolute}.sheet{max-width:100%}}

/* ---------- entrada ---------- */
.rv{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.prod.rv{animation-name:side}
@keyframes side{from{opacity:0;transform:translateX(18px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rail{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="stage">
  <p class="caption" id="caption"></p>
  <div class="device" id="device">
    <main class="screen" id="screen">
      <header class="hero">
        <div class="avatar rv" id="avatar" style="--i:0"></div>
        <h1 class="name rv" id="nome" style="--i:1"></h1>
        <p class="role rv" id="apoio" style="--i:2"></p>
        <p class="sub rv" id="subtitulo" style="--i:3"></p>
        <nav class="socials rv" id="redes" style="--i:4" aria-label="Redes sociais"></nav>
      </header>

      <!-- Botão principal: abre o quiz no Inlead em nova aba. TODO: colar o link em CONFIG.inlead.url -->
      <a class="cta rv" id="cta" style="--i:5" href="#">
        <span class="cta-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-chama"/></svg></span>
        <span class="cta-txt"><span class="cta-t" id="cta-t"></span><span class="cta-s" id="cta-s"></span></span>
        <span class="cta-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>

      <section aria-labelledby="t-prod">
        <h2 class="sec-title rv" id="t-prod" style="--i:6"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z" fill="currentColor"/></svg>Como posso te ajudar hoje:</h2>
        <div class="rail" id="rail"></div>
      </section>

      <!-- Links extras. TODO: links em CONFIG.links -->
      <section class="stack" id="links" aria-label="Lives e comunidade"></section>

      <!-- WhatsApp. TODO: números em CONFIG.whatsapp -->
      <section class="stack" id="whats" aria-label="Falar pelo WhatsApp"></section>

      <footer class="foot" id="foot"></footer>
    </main>

    <div class="layer" id="layer" hidden>
      <div class="backdrop" data-close></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- Ícones. TODO trocar pela chama oficial da Forno (SVG viewBox 0 0 1037.60 1344.70): substituir o <symbol id="i-chama"> inteiro -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chama" viewBox="0 0 24 24"><path fill="currentColor" d="M12.7 1.6c.4 3.2-1.3 5-2.9 6.7C8.3 9.9 6.8 11.6 6.8 14.4c0 3.6 2.5 7 5.6 7 3.2 0 5.8-2.9 5.8-6.7 0-2.6-1.1-4.4-2.4-5.8.1 1.9-.5 3.4-1.8 4.1.8-4 .1-7.9-1.3-11.4z"/></symbol>
  <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.2 9.3l4.8 2.7-4.8 2.7z" fill="currentColor"/></symbol>
  <symbol id="i-linkedin" viewBox="0 0 24 24"><rect x="4.2" y="9.3" width="3.1" height="10.2" rx=".4" fill="currentColor"/><circle cx="5.75" cy="5.6" r="1.85" fill="currentColor"/><path fill="currentColor" d="M10 9.3h3v1.5c.5-.9 1.7-1.8 3.5-1.8 3 0 3.7 2 3.7 4.6v5.9h-3.1v-5.2c0-1.3-.1-2.8-1.8-2.8s-2.2 1.3-2.2 2.7v5.3H10z"/></symbol>
  <symbol id="i-tiktok" viewBox="0 0 24 24"><path fill="currentColor" d="M14.1 3h3c.2 1.9 1.6 3.4 3.5 3.6v3c-1.3 0-2.5-.4-3.5-1v6.2a5.8 5.8 0 1 1-5.8-5.8v3.1a2.7 2.7 0 1 0 2.8 2.7z"/></symbol>
  <symbol id="i-whats" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3.6 20.4l1.3-4.1A8.6 8.6 0 1 1 8.1 19.5z"/><path fill="currentColor" d="M9 8.2c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.2 0 .4-.1.6l-.5.6c-.1.1-.1.3 0 .5.4.7 1.3 1.7 2.4 2.2.2.1.4.1.5-.1l.6-.7c.2-.2.4-.2.6-.1l1.5.7c.2.1.3.3.3.5 0 .5-.2 1.2-.8 1.5-.6.4-1.4.5-2.5.1-2.2-.8-4-2.8-4.6-4.3-.4-1-.2-2.2.2-3z"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<script>
(function () {
  'use strict';
  var C = CONFIG;
  var root = document.documentElement;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var insta = C.pessoa.instagram;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ico = function (id, cls) { return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' aria-hidden="true"><use href="#i-' + id + '"/></svg>'; };
  var fill = function (s) { return String(s).split('{insta}').join(insta); };

  root.classList.toggle('show-todo', !!C.mostrarLegendas);
  C.produtos.forEach(function (p) { root.style.setProperty('--c-' + p.id, p.cor); });

  /* ---- links: vazio ou número com X = placeholder (href="#", aviso ao clicar) ---- */
  function waUrl(num, msg) {
    var d = String(num || '').replace(/\D/g, '');
    if (!num || /x/i.test(num) || d.length < 12) return null;
    return 'https://wa.me/' + d + '?text=' + encodeURIComponent(fill(msg));
  }
  function quizUrl(origem) {
    var base = String(C.inlead.url || '').trim();
    if (!base) return null;
    try {
      var u = new URL(base);
      u.searchParams.set('utm_source', C.inlead.utmSource);
      u.searchParams.set('utm_medium', 'linkbio');
      u.searchParams.set('utm_content', origem);
      return u.href;
    } catch (e) { return null; }
  }
  function attrs(href, rotulo) {
    return href ? 'href="' + esc(href) + '" target="_blank" rel="noopener"' : 'href="#" data-todo="' + esc(rotulo) + '"';
  }
  function setLink(a, href, rotulo) {
    if (href) { a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.removeAttribute('data-todo'); }
    else { a.href = '#'; a.setAttribute('data-todo', rotulo); }
  }
  function fmtNum(n) {
    var d = String(n || '').replace(/[^\dXx]/g, '');
    return d.length === 13 ? '+' + d.slice(0, 2) + ' ' + d.slice(2, 4) + ' ' + d.slice(4, 9) + '-' + d.slice(9) : n;
  }

  /* ---- topo ---- */
  var P = C.pessoa;
  $('caption').innerHTML = '<b>Modelo para aprovação</b><span>Link da bio · @' + esc(insta) + '</span>';
  $('avatar').innerHTML = P.foto
    ? '<img src="' + esc(P.foto) + '" alt="Foto de ' + esc(P.nome) + '">'
    : '<span class="ini" aria-hidden="true">' + esc(P.iniciais) + '</span><span class="todo">trocar foto</span>';
  if (!P.foto) $('avatar').setAttribute('aria-label', 'Foto de ' + P.nome);
  $('nome').textContent = P.nome;
  $('apoio').innerHTML = ico('chama') + esc(P.apoio);
  $('subtitulo').textContent = P.subtitulo;
  var redesNome = { instagram: 'Instagram', youtube: 'YouTube', linkedin: 'LinkedIn', tiktok: 'TikTok' };
  $('redes').innerHTML = C.redes.map(function (r) {
    var rot = redesNome[r.rede] || r.rede;
    return '<a class="soc" ' + attrs(r.url, rot) + ' aria-label="' + esc(rot + ' de ' + P.nome) + '">' + ico(r.rede) + '</a>';
  }).join('');

  /* ---- botão principal ---- */
  $('cta-t').textContent = C.botaoPrincipal.titulo;
  $('cta-s').textContent = C.botaoPrincipal.subtitulo;
  $('cta').setAttribute('aria-label', C.botaoPrincipal.titulo + ' ' + C.botaoPrincipal.subtitulo + ' (abre o quiz em nova aba)');
  setLink($('cta'), quizUrl('botao_principal'), 'O quiz do Inlead');

  /* ---- capas dos produtos (CSS, sem imagem) ---- */
  var CAPAS = {
    forno: function (p) {
      return '<div class="cv cv-forno"><div class="cv-top"><svg class="cv-flame" aria-hidden="true"><use href="#i-chama"/></svg><span class="cv-kicker">Agência</span></div>' +
        '<div><div class="cv-word"><span>FORNO</span><span>LAB</span></div><i class="cv-ember"></i><p class="cv-slogan">' + esc(p.slogan) + '</p></div></div>';
    },
    advisor: function () {
      return '<div class="cv cv-advisor"><span class="cv-pill">6 meses</span>' +
        '<ol class="cv-steps"><li>Diagnóstico</li><li>Planejamento</li><li>Rotina</li><li>Indicadores</li></ol>' +
        '<div><div class="cv-aword">ADVISOR</div><p class="cv-asub">Começo, meio e fim.</p></div></div>';
    },
    founders: function () {
      return '<div class="cv cv-founders"><div class="cv-mast"><b>Founders</b><div class="cv-meta"><span>Founder-Led Growth</span><span>Lives · 20h</span></div></div>' +
        '<p class="cv-head">O Código do Conteúdo</p><div class="cv-body"><i class="cv-dots"></i><i class="cv-lines"></i></div></div>';
    }
  };
  $('rail').innerHTML = C.produtos.map(function (p, i) {
    return '<article class="prod rv" style="--i:' + (7 + i) + '">' +
      '<div class="cover" data-open="' + p.id + '" aria-hidden="true">' + CAPAS[p.id](p) + '</div>' +
      '<p class="prod-n">' + esc(p.nome) + '<span class="todo">logo provisório</span></p><p class="prod-t">' + esc(p.tag) + '</p>' +
      '<button class="more" type="button" data-open="' + p.id + '" aria-label="Ver detalhes de ' + esc(p.nome) + '">Ver detalhes</button></article>';
  }).join('');

  /* ---- links extras ---- */
  var THUMB = {
    live: '<span class="lk-th live" aria-hidden="true"><small><i></i>AO VIVO</small><b>20h</b></span>',
    grupo: '<span class="lk-th grupo" aria-hidden="true">' + ico('whats') + '</span>'
  };
  $('links').innerHTML = C.links.map(function (l, i) {
    return '<a class="lk rv" style="--i:' + (10 + i) + '" ' + attrs(l.url, l.titulo) + '>' + (THUMB[l.thumb] || '') +
      '<span class="lk-tx"><span class="lk-t">' + esc(l.titulo) + '</span><span class="lk-s">' + esc(l.subtitulo) + '</span></span>' +
      ico('ext', 'lk-ex') + '</a>';
  }).join('');

  /* ---- WhatsApp ---- */
  $('whats').innerHTML = C.cardsWhatsapp.map(function (w, i) {
    var num = C.whatsapp[w.numero];
    return '<div class="wa rv" style="--i:' + (12 + i) + '"><div class="wa-top"><span class="wa-ic" aria-hidden="true">' + ico('whats') + '</span>' +
      '<span><span class="wa-l">WhatsApp</span><br><span class="wa-n">' + esc(fmtNum(num)) + '</span></span></div>' +
      '<p class="wa-t">' + esc(w.titulo) + '</p>' +
      '<a class="wa-b" ' + attrs(waUrl(num, w.mensagem), 'O número de WhatsApp') + ' aria-label="Iniciar conversa no WhatsApp: ' + esc(w.titulo) + '">Iniciar conversa →</a></div>';
  }).join('');

  /* ---- rodapé ---- */
  var ig = (C.redes.filter(function (r) { return r.rede === 'instagram'; })[0] || {}).url;
  $('foot').innerHTML = '<a ' + attrs(ig, 'Instagram') + ' aria-label="Instagram de ' + esc(P.nome) + '">' + ico('instagram') + esc(P.nome) + '</a>' +
    '<p>' + ico('chama') + 'Forno Lab · Fortaleza, CE</p>';

  /* ---- detalhes do produto ---- */
  var layer = $('layer'), sheet = $('sheet'), device = $('device');
  var lastFocus = null, closeTimer = null;
  function bloco(b) {
    var h = '<div class="blk"><h3>' + esc(b.titulo) + '</h3>';
    if (b.texto) h += '<p>' + esc(b.texto) + '</p>';
    if (b.lista) {
      var tag = b.sequencia ? 'ol' : 'ul';
      h += '<' + tag + '>' + b.lista.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</' + tag + '>';
    }
    return h + '</div>';
  }
  function openProduct(id, trigger) {
    var p = C.produtos.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    clearTimeout(closeTimer);
    sheet.setAttribute('data-p', p.id);
    sheet.innerHTML =
      '<div class="grab" aria-hidden="true"></div>' +
      '<button class="x" type="button" data-close aria-label="Fechar detalhes">' + ico('x') + '</button>' +
      '<div class="sh-head"><p class="sh-eye">' + esc(p.eyebrow) + '</p><h2 class="sh-title" id="sh-title">' + esc(p.titulo) + '</h2>' +
      '<a class="sh-ig" ' + attrs('https://www.instagram.com/' + p.instagram + '/', 'Instagram') + ' aria-label="Instagram @' + esc(p.instagram) + '">' + ico('instagram') + '@' + esc(p.instagram) + '</a></div>' +
      '<div class="sh-body"><p class="sh-intro">' + esc(p.intro) + '</p>' + p.blocos.map(bloco).join('') + '</div>' +
      '<div class="sh-act"><a class="sh-btn" ' + attrs(waUrl(C.whatsapp[p.whatsapp], p.mensagem), 'O número de WhatsApp') + '>' + ico('whats') + esc(p.cta) + '</a>' +
      '<a class="sh-quiz" ' + attrs(quizUrl('detalhes_' + p.id), 'O quiz do Inlead') + '>Prefere o quiz? Descubra o caminho certo</a></div>';
    sheet.scrollTop = 0;
    lastFocus = trigger || document.activeElement;
    layer.hidden = false;
    root.style.overflow = 'hidden';
    device.classList.add('locked');
    requestAnimationFrame(function () { requestAnimationFrame(function () { layer.classList.add('open'); }); });
    sheet.querySelector('.x').focus({ preventScroll: true });
  }
  function closeProduct() {
    if (layer.hidden) return;
    layer.classList.remove('open');
    root.style.overflow = '';
    device.classList.remove('locked');
    closeTimer = setTimeout(function () { layer.hidden = true; }, reduce ? 0 : 420);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  /* ---- aviso para links ainda não configurados ---- */
  var toastEl = $('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    var todo = t.closest && t.closest('a[data-todo]');
    if (todo) { e.preventDefault(); toast(todo.getAttribute('data-todo') + ' entra aqui. Link em configuração.'); return; }
    var op = t.closest && t.closest('[data-open]');
    if (op) { openProduct(op.getAttribute('data-open'), op.tagName === 'BUTTON' ? op : op.parentNode.querySelector('.more')); return; }
    if (t.closest && t.closest('[data-close]')) closeProduct();
  });
  document.addEventListener('keydown', function (e) {
    if (layer.hidden) return;
    if (e.key === 'Escape') { closeProduct(); return; }
    if (e.key === 'Tab') {
      var f = sheet.querySelectorAll('a[href],button');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();
</script>

</body>
</html>
